[project]
name = "django-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ismail3427", email = "ismailurfy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-stubs>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-stubs>=3.18.2",
    "keras>=3.15.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "tensorflow>=2.21.0",
]

[project.scripts]
django-backend = "django_backend:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
